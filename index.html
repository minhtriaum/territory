<!doctype html><html><head><meta charset=utf8><meta name=viewport content="width=device-width,initial-scale=1,viewport-fit=cover"><style>:root{color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}html{scroll-padding-top:env(safe-area-inset-top,0px)}body{margin:0;padding:0;font:14px -apple-system,BlinkMacSystemFont,sans-serif;background:#fff;color:#000}img{max-width:100%}[hidden]:not([hidden=until-found i]){display:none!important}</style></head><body>
<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>가두증거 구역배정</title>
<style>
:root{--bg:#f5f6f8;--card:#fff;--tx:#1d2330;--sub:#6b7385;--ac:#2f6fed;--bd:#e1e4ea;--dg:#d64545;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#14171d;--card:#1e222b;--tx:#eceff4;--sub:#9aa3b5;--ac:#6b9bff;--bd:#2f3542;--dg:#ff7a7a}}
:root[data-theme="dark"]{--bg:#14171d;--card:#1e222b;--tx:#eceff4;--sub:#9aa3b5;--ac:#6b9bff;--bd:#2f3542;--dg:#ff7a7a}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--tx);font:15px/1.5 -apple-system,"Noto Sans KR","Malgun Gothic",sans-serif}
main{max-width:560px;margin:0 auto;padding:12px 14px 40px}
h1{font-size:19px;margin:6px 0 10px}
.tabs{display:flex;gap:6px;margin-bottom:12px}
.tabs button{flex:1;padding:10px;border:1px solid var(--bd);background:var(--card);color:var(--tx);border-radius:10px;font-size:15px}
.tabs button.on{background:var(--ac);color:#fff;border-color:var(--ac)}
.card{background:var(--card);border:1px solid var(--bd);border-radius:12px;padding:14px;margin-bottom:12px}
.card h2{font-size:15px;margin:0 0 10px}
label{display:block;font-size:13px;color:var(--sub);margin:8px 0 3px}
input,select{width:100%;padding:10px;border:1px solid var(--bd);border-radius:8px;background:var(--bg);color:var(--tx);font-size:15px}
.r{display:flex;gap:8px;align-items:center}
.r>*{flex:1}
.btn{width:100%;padding:11px;border:0;border-radius:8px;background:var(--ac);color:#fff;font-size:15px;margin-top:10px}
.btn.s{background:var(--bg);color:var(--tx);border:1px solid var(--bd)}
.x{flex:0 0 auto;width:auto;border:0;background:none;color:var(--dg);font-size:14px;padding:4px 8px}
table{width:100%;border-collapse:collapse;font-size:14px;margin-bottom:14px}
th,td{border-bottom:1px solid var(--bd);padding:8px 4px;text-align:left;vertical-align:top}
th{color:var(--sub);font-weight:600;font-size:13px}
.li{display:flex;align-items:center;justify-content:space-between;border-bottom:1px solid var(--bd);padding:8px 0;gap:8px}
.li small{color:var(--sub);display:block}
.empty{color:var(--sub);text-align:center;padding:14px 0;font-size:14px}
.rn h3{font-size:14px;margin:12px 0 4px}
.rn div{font-size:14px;color:var(--sub);padding-left:4px}
#ov{position:fixed;inset:0;background:rgba(0,0,0,.75);display:none;flex-direction:column;align-items:center;justify-content:center;padding:16px;gap:10px;z-index:9}
#ov img{max-width:100%;max-height:75%;background:#fff;border-radius:8px}
#ov p{color:#fff;margin:0;font-size:14px}
#ov .btn{width:auto;padding:10px 28px}
</style>
</head>
<body>
<main>
<h1>가두증거 구역배정</h1>
<div class="tabs"><button id="t1" class="on">배정</button><button id="t2">설정</button></div>

<section id="p1">
  <div class="card">
    <label>날짜</label><input type="date" id="date">
    <label>1) 구역</label><select id="zone"></select>
    <label>2) 시간 (시작 / 종료)</label>
    <div class="r"><input type="time" id="st" value="09:00"><input type="time" id="en" value="10:00"></div>
    <label>3) 전도인</label><select id="ppl"></select>
    <button class="btn" id="add">표에 추가</button>
  </div>
  <div class="card">
    <h2>배정표</h2>
    <div id="tbl"></div>
    <div class="r" style="margin-top:10px"><button class="btn s" id="shT">텍스트 공유</button><button class="btn" id="shI">이미지 공유</button></div>
    <button class="btn s" id="clr">표 비우기</button>
  </div>
</section>

<section id="p2" style="display:none">
  <div id="login" class="card">
    <h2>로그인</h2>
    <label>ID</label><input id="lid" autocapitalize="off">
    <label>비밀번호</label><input id="lpw" type="password">
    <button class="btn" id="lgo">로그인</button>
    <div id="lerr" class="empty" style="color:var(--dg);padding:6px 0 0"></div>
  </div>

  <div id="pwc" class="card" style="display:none">
    <h2>비밀번호 변경</h2>
    <div id="pwm" style="font-size:14px;color:var(--sub)"></div>
    <label>새 비밀번호 (4자 이상)</label><input id="np" type="password">
    <label>새 비밀번호 확인</label><input id="np2" type="password">
    <button class="btn" id="pwgo">변경</button>
    <button class="btn s" id="pwcan">취소</button>
    <div id="pwe" class="empty" style="color:var(--dg);padding:6px 0 0"></div>
  </div>

  <div id="adm" style="display:none">
    <div class="card">
      <h2>1) 구역 등록</h2>
      <input id="zn" placeholder="구역명"><label>구역 설명</label><input id="zd" placeholder="예) 역 2번 출구 앞">
      <button class="btn" id="zadd">구역 추가</button><div id="zl"></div>
    </div>
    <div class="card">
      <h2>2) 전도인 등록</h2>
      <div class="r"><input id="pn" placeholder="이름"><button class="btn" id="padd" style="margin:0;flex:0 0 80px">등록</button></div>
      <div id="pl"></div>
    </div>
    <div class="card" id="ac">
      <h2>3) 계정 등록 (인도자 계정)</h2>
      <input id="aid" placeholder="ID" autocapitalize="off"><label>초기 비밀번호</label><input id="apw" placeholder="초기 비밀번호"><label>이름</label><input id="anm" placeholder="이름">
      <button class="btn" id="aadd">계정 추가</button>
      <div class="empty" style="padding:6px 0 0;text-align:left">신규 계정은 최초 로그인 시 비밀번호를 반드시 변경합니다.</div>
      <div id="al"></div>
    </div>
    <div class="card" id="lc">
      <h2>4) 인도자 접속 로그</h2><div id="ll"></div>
      <button class="btn s" id="lclr">로그 지우기</button>
    </div>
    <div class="card" id="vc">
      <h2>5) 버전 / 릴리즈 노트</h2><div id="vv" class="rn"></div>
    </div>
    <button class="btn s" id="pwopen">내 비밀번호 변경</button>
    <button class="btn s" id="lout">로그아웃</button>
  </div>
</section>
</main>

<div id="ov"><img id="oi" alt=""><p>이미지를 길게 눌러 저장하세요</p><button class="btn" id="oc">닫기</button></div>

<script>
const $=id=>document.getElementById(id);
const KEY='zoneAssignV1';
const VERSION='261012_1500';
const RELEASES=[
 {v:'261012_1500',items:[
  '설정 페이지에 버전 정보·릴리즈 노트 추가 (관리자 전용)',
  '신규 계정은 최초 로그인 시 비밀번호 변경 필수',
  '로그인한 사용자가 직접 비밀번호 변경 가능',
  '관리자 계정에서 인도자 계정 비밀번호 초기화 (1234)',
  '배정표를 구역별로 분리: 같은 구역은 시간 행으로 추가, 새 구역은 표를 새로 만들어 하단에 추가'
 ]},
 {v:'이전 버전',items:[
  '구역/시간/전도인 배정표, 이미지·텍스트 공유',
  '같은 구역·시간의 인원 묶음 표시',
  '계정 등록은 관리자 전용, 인도자 접속 로그'
 ]}
];
let S={zones:[],people:[],accts:[{id:'admin',pw:'1234',name:'관리자',role:'admin'}],rows:[],date:'',logs:[]};
try{const v=JSON.parse(localStorage.getItem(KEY)||'null');if(v)S=Object.assign(S,v)}catch(e){}
const save=()=>{try{localStorage.setItem(KEY,JSON.stringify(S))}catch(e){}};
let authed=false,cur=null,showPw=false;
S.accts.forEach(a=>{a.role=a.role||(a.id==='admin'?'admin':'guide')});if(!S.logs)S.logs=[];

function el(t,txt,cls){const e=document.createElement(t);if(txt!=null)e.textContent=txt;if(cls)e.className=cls;return e}
function fillSel(sel,arr,f){sel.textContent='';if(!arr.length){sel.appendChild(new Option('(설정에서 먼저 등록)',''));return}arr.forEach(a=>sel.appendChild(new Option(f(a),f(a))))}
function listUI(box,arr,label,sub,del){
  box.textContent='';
  if(!arr.length){box.appendChild(el('div','등록된 항목 없음','empty'));return}
  arr.forEach((a,i)=>{const d=el('div',null,'li');const l=el('div',label(a));const s=sub&&sub(a);if(s)l.appendChild(el('small',s));d.appendChild(l);
    const b=el('button','삭제','x');b.onclick=()=>{del(i)};d.appendChild(b);box.appendChild(d)});
}

/* 구역별 그룹: 구역 순서는 최초 배정 순, 구역 내에서는 시간순 */
function byZone(){
  const order=[];S.rows.forEach(r=>{if(!order.includes(r.zone))order.push(r.zone)});
  return order.map(zone=>{
    const t=new Map();
    S.rows.filter(r=>r.zone===zone).sort((a,b)=>a.st.localeCompare(b.st)||a.en.localeCompare(b.en)).forEach(r=>{
      const k=r.st+'|'+r.en;if(!t.has(k))t.set(k,{st:r.st,en:r.en,rs:[]});t.get(k).rs.push(r)});
    return{zone,slots:[...t.values()].map(x=>(x.ps=x.rs.map(r=>r.p),x))};
  });
}

function render(){
  fillSel($('zone'),S.zones,z=>z.n);fillSel($('ppl'),S.people,p=>p);
  $('date').value=S.date||'';
  const box=$('tbl');box.textContent='';
  if(!S.rows.length){box.appendChild(el('div','추가된 배정이 없습니다','empty'))}
  else byZone().forEach(z=>{
    const t=el('table'),h=el('tr');['구역','시간','인원'].forEach(x=>h.appendChild(el('th',x)));t.appendChild(h);
    z.slots.forEach((s,i)=>{
      const tr=el('tr');
      if(i===0){const c=el('td',z.zone);c.rowSpan=z.slots.length;c.style.fontWeight='700';tr.appendChild(c)}
      tr.appendChild(el('td',s.st+'~'+s.en));
      const td=el('td');
      s.rs.forEach(r=>{const w=el('div',r.p);const b=el('button','✕','x');b.onclick=()=>{S.rows=S.rows.filter(y=>y!==r);save();render()};w.appendChild(b);td.appendChild(w)});
      tr.appendChild(td);t.appendChild(tr);
    });
    box.appendChild(t);
  });
  listUI($('zl'),S.zones,z=>z.n,z=>z.d,i=>{S.zones.splice(i,1);save();render()});
  listUI($('pl'),S.people,p=>p,null,i=>{S.people.splice(i,1);save();render()});

  const al=$('al');al.textContent='';
  const gl=S.accts.filter(a=>a.role!=='admin');
  if(!gl.length)al.appendChild(el('div','등록된 계정 없음','empty'));
  gl.forEach(a=>{
    const d=el('div',null,'li'),l=el('div',a.id+' ('+a.name+')');
    if(a.mustChange)l.appendChild(el('small','최초 로그인 시 비밀번호 변경 필요'));
    d.appendChild(l);
    const bw=el('div'),rb=el('button','비번 초기화','x'),db=el('button','삭제','x');
    rb.style.color='var(--ac)';
    rb.onclick=()=>{if(confirm(a.id+' 계정의 비밀번호를 1234로 초기화할까요?\n다음 로그인 때 변경해야 합니다.')){a.pw='1234';a.mustChange=true;save();render()}};
    db.onclick=()=>{if(confirm(a.id+' 계정을 삭제할까요?')){S.accts.splice(S.accts.indexOf(a),1);save();render()}};
    bw.appendChild(rb);bw.appendChild(db);d.appendChild(bw);al.appendChild(d);
  });

  const ll=$('ll');ll.textContent='';
  const L=S.logs.slice().reverse();
  if(!L.length)ll.appendChild(el('div','접속 기록 없음','empty'));
  L.slice(0,100).forEach(l=>{const d=el('div',null,'li');const x=el('div',l.name+' ('+l.id+')');x.appendChild(el('small',l.t));d.appendChild(x);ll.appendChild(d)});

  const vv=$('vv');vv.textContent='';
  const cv=el('div','현재 버전  '+VERSION);cv.style.cssText='font-size:16px;font-weight:700;color:var(--tx)';vv.appendChild(cv);
  RELEASES.forEach(r=>{vv.appendChild(el('h3',r.v));r.items.forEach(i=>vv.appendChild(el('div','· '+i)))});
}

function tab(n){$('p1').style.display=n==1?'':'none';$('p2').style.display=n==2?'':'none';$('t1').className=n==1?'on':'';$('t2').className=n==2?'on':''}
$('t1').onclick=()=>tab(1);$('t2').onclick=()=>tab(2);

$('date').onchange=e=>{S.date=e.target.value;save()};
$('add').onclick=()=>{
  const zone=$('zone').value,p=$('ppl').value,st=$('st').value,en=$('en').value;
  if(!zone||!p){alert('구역과 전도인을 선택하세요 (설정에서 등록)');return}
  if(!st||!en||en<=st){alert('시작/종료 시간을 확인하세요');return}
  if(S.rows.some(r=>r.zone===zone&&r.st===st&&r.en===en&&r.p===p)){alert('이미 추가된 인원입니다');return}
  S.rows.push({zone,st,en,p});save();render();
};
$('clr').onclick=()=>{if(S.rows.length&&confirm('표를 모두 비울까요?')){S.rows=[];save();render()}};

function title(){return '가두증거 구역배정'+(S.date?' ('+S.date+')':'')}
function toText(){return title()+'\n\n'+byZone().map(z=>'['+z.zone+']\n'+z.slots.map(s=>s.st+'~'+s.en+' | '+s.ps.join(', ')).join('\n')).join('\n\n')}
$('shT').onclick=async()=>{
  if(!S.rows.length){alert('공유할 내용이 없습니다');return}
  const t=toText();
  try{if(navigator.share){await navigator.share({text:t});return}}catch(e){if(e.name==='AbortError')return}
  try{await navigator.clipboard.writeText(t);alert('텍스트가 복사되었습니다')}catch(e){prompt('복사해서 사용하세요',t)}
};

function wrap(g,txt,w){const out=[];let line='';for(const ch of txt){if(g.measureText(line+ch).width>w&&line){out.push(line);line=ch}else line+=ch}if(line)out.push(line);return out}
$('shI').onclick=()=>{
  if(!S.rows.length){alert('공유할 내용이 없습니다');return}
  const Z=byZone(),W=720,RH=56,PX=420,PW=276,c=document.createElement('canvas'),g=c.getContext('2d'),F='"Noto Sans KR","Malgun Gothic",sans-serif';
  g.font='24px '+F;
  Z.forEach(z=>z.slots.forEach(s=>{s.ln=wrap(g,s.ps.join(', '),PW);s.h=Math.max(RH,32*s.ln.length+20)}));
  let H=96;Z.forEach(z=>{H+=RH+z.slots.reduce((a,s)=>a+s.h,0)+24});
  c.width=W;c.height=H;
  g.fillStyle='#fff';g.fillRect(0,0,W,H);g.textBaseline='middle';
  g.fillStyle='#1d2330';g.font='bold 30px '+F;g.fillText(title(),24,48,W-48);
  let y=96;
  Z.forEach(z=>{
    g.fillStyle='#eef1f6';g.fillRect(0,y,W,RH);g.fillStyle='#6b7385';g.font='bold 22px '+F;
    g.fillText('구역',24,y+RH/2);g.fillText('시간',210,y+RH/2);g.fillText('인원',PX,y+RH/2);y+=RH;
    const top=y,tot=z.slots.reduce((a,s)=>a+s.h,0);
    g.fillStyle='#1d2330';g.font='bold 24px '+F;g.fillText(z.zone,24,top+tot/2,170);
    g.font='24px '+F;
    z.slots.forEach((s,i)=>{
      g.fillStyle='#e1e4ea';const last=i===z.slots.length-1;g.fillRect(last?0:200,y+s.h-1,last?W:W-200,1);
      g.fillStyle='#1d2330';g.fillText(s.st+'~'+s.en,210,y+s.h/2);
      const off=(s.h-32*s.ln.length)/2+16;s.ln.forEach((l,k)=>g.fillText(l,PX,y+off+32*k));
      y+=s.h;
    });
    y+=24;
  });
  c.toBlob(async b=>{
    const f=new File([b],'zone-assign.png',{type:'image/png'});
    try{if(navigator.canShare&&navigator.canShare({files:[f]})){await navigator.share({files:[f]});return}}catch(e){if(e.name==='AbortError')return}
    $('oi').src=URL.createObjectURL(b);$('ov').style.display='flex';
  });
};
$('oc').onclick=()=>{$('ov').style.display='none'};

function gate(){
  const forced=authed&&cur&&cur.mustChange,ad=authed&&cur&&cur.role==='admin',sh=v=>v?'':'none';
  $('login').style.display=sh(!authed);
  $('adm').style.display=sh(authed&&!forced&&!showPw);
  $('pwc').style.display=sh(authed&&(forced||showPw));
  $('pwcan').style.display=sh(!forced);
  $('pwm').textContent=forced?'최초 로그인입니다. 초기 비밀번호를 반드시 변경해야 합니다.':'';
  $('ac').style.display=sh(ad);$('lc').style.display=sh(ad);$('vc').style.display=sh(ad);
}
$('lgo').onclick=()=>{
  const a=S.accts.find(x=>x.id===$('lid').value.trim()&&x.pw===$('lpw').value);
  if(a){
    authed=true;cur=a;showPw=false;$('lerr').textContent='';$('lpw').value='';
    if(a.role!=='admin'){S.logs.push({id:a.id,name:a.name,t:new Date().toLocaleString('ko-KR')});if(S.logs.length>300)S.logs=S.logs.slice(-300);save()}
    render();gate();
  }else $('lerr').textContent='ID 또는 비밀번호가 올바르지 않습니다';
};
$('lout').onclick=()=>{authed=false;cur=null;showPw=false;gate()};
$('pwopen').onclick=()=>{showPw=true;$('pwe').textContent='';gate()};
$('pwcan').onclick=()=>{showPw=false;$('np').value=$('np2').value='';gate()};
$('pwgo').onclick=()=>{
  const a=$('np').value,b=$('np2').value,e=m=>{$('pwe').textContent=m};
  if(a.length<4){e('4자 이상 입력하세요');return}
  if(a!==b){e('확인 값이 일치하지 않습니다');return}
  if(a===cur.pw){e('기존 비밀번호와 다르게 입력하세요');return}
  cur.pw=a;cur.mustChange=false;save();showPw=false;$('np').value=$('np2').value='';e('');render();gate();
};
$('lclr').onclick=()=>{if(confirm('접속 로그를 모두 지울까요?')){S.logs=[];save();render()}};
$('zadd').onclick=()=>{const n=$('zn').value.trim();if(!n)return;if(S.zones.some(z=>z.n===n)){alert('이미 있는 구역명입니다');return}
  S.zones.push({n,d:$('zd').value.trim()});$('zn').value=$('zd').value='';save();render()};
$('padd').onclick=()=>{const n=$('pn').value.trim();if(!n||S.people.includes(n))return;S.people.push(n);$('pn').value='';save();render()};
$('aadd').onclick=()=>{const id=$('aid').value.trim(),pw=$('apw').value,nm=$('anm').value.trim();
  if(!id||!pw||!nm){alert('ID/초기 비밀번호/이름을 모두 입력하세요');return}
  if(S.accts.some(a=>a.id===id)){alert('이미 있는 ID입니다');return}
  S.accts.push({id,pw,name:nm,role:'guide',mustChange:true});$('aid').value=$('apw').value=$('anm').value='';save();render()};

render();gate();
</script>
