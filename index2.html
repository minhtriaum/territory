<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover"><meta name="theme-color" content="#f5f7fb">
  <title>활동 배치표</title>
  <style>
    :root{color-scheme:light;--ink:#18233c;--muted:#778198;--line:#e8ebf2;--primary:#475de8;--pale:#eef0ff;--bg:#f5f7fb;--white:#fff;--shadow:0 12px 36px rgba(32,47,92,.08)}
    *{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font-family:-apple-system,BlinkMacSystemFont,"Apple SD Gothic Neo","Noto Sans KR",sans-serif;-webkit-font-smoothing:antialiased}button,input,textarea,select{font:inherit}button{cursor:pointer}.topbar{padding:16px max(18px,calc((100vw - 1120px)/2));background:#fff;border-bottom:1px solid var(--line);display:flex;align-items:center;justify-content:space-between;gap:18px}.brand{display:flex;align-items:center;gap:11px;min-width:0}.brand-icon{display:grid;place-items:center;width:40px;height:40px;border-radius:13px;background:var(--pale);color:var(--primary);font-size:20px;flex:none}.brand h1{font-size:16px;margin:0 0 3px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}.brand p{font-size:11px;color:var(--muted);margin:0}.nav{display:flex;background:#f2f4f8;border-radius:11px;padding:3px;flex:none}.nav button{border:0;border-radius:9px;background:transparent;color:#727b90;font-weight:700;font-size:12px;padding:9px 14px}.nav button.active{background:#fff;color:var(--primary);box-shadow:0 1px 4px #18233c12}.wrap{max-width:1120px;margin:24px auto;padding:0 20px 56px;display:grid;grid-template-columns:370px 1fr;gap:20px;align-items:start}.panel{background:var(--white);border:1px solid var(--line);border-radius:20px;box-shadow:var(--shadow)}.editor,.settings{padding:21px;position:sticky;top:18px}.panel-head{display:flex;justify-content:space-between;align-items:center;margin-bottom:17px}.panel-head h2{font-size:15px;margin:0}.step{font-size:10px;color:var(--primary);background:var(--pale);border-radius:20px;padding:6px 9px;font-weight:700}.field{margin:0 0 13px}.field label{display:block;font-size:12px;font-weight:700;margin:0 0 7px}.field input,.field textarea,.field select{width:100%;border:1px solid #dfe3ec;border-radius:11px;padding:11px 12px;color:var(--ink);background:#fff;outline:none;font-size:14px;transition:border-color .15s,box-shadow .15s}.field input:focus,.field textarea:focus,.field select:focus{border-color:#8794f4;box-shadow:0 0 0 3px #475de81a}.field textarea{resize:vertical;min-height:68px}.time-row{display:grid;grid-template-columns:1fr 1fr;gap:9px}.time-row input{padding:10px}.add-btn{width:100%;border:0;border-radius:12px;padding:13px;background:var(--primary);color:#fff;font-weight:700;font-size:14px;box-shadow:0 6px 14px #475de833}.helper{margin:10px 0 0;color:var(--muted);font-size:11px;line-height:1.55}.entries{margin-top:18px;border-top:1px solid var(--line);padding-top:15px}.entries-head{display:flex;justify-content:space-between;align-items:center;margin-bottom:8px}.entries-head strong{font-size:12px}.text-btn{border:0;background:none;color:var(--muted);font-size:11px;padding:5px}.entry{display:flex;gap:9px;align-items:center;padding:9px 0;border-bottom:1px solid #f0f1f5}.entry:last-child{border:0}.entry-dot{width:8px;height:8px;flex:none;border-radius:50%;background:var(--primary)}.entry-copy{min-width:0;flex:1}.entry-copy b{display:block;font-size:11px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.entry-copy span{display:block;font-size:10px;color:var(--muted);margin-top:3px}.remove{border:0;background:#f4f5f8;color:#858da0;border-radius:8px;width:28px;height:28px;font-size:17px}.empty-small{padding:14px 0;text-align:center;color:#a2a9b8;font-size:11px}.preview{padding:23px}.preview-top{display:flex;justify-content:space-between;align-items:flex-start;gap:14px;margin-bottom:18px}.eyebrow{font-size:10px;color:var(--primary);font-weight:800;letter-spacing:.1em;margin:0 0 6px}.preview-title h2{font-size:20px;margin:0}.preview-title p{font-size:12px;color:var(--muted);margin:7px 0 0}.actions{display:flex;gap:7px;flex:none}.action{padding:10px 12px;border-radius:10px;font-weight:700;font-size:12px;border:1px solid var(--line);background:#fff;color:var(--ink)}.action.primary{background:var(--ink);border-color:var(--ink);color:#fff}.table-wrap{border:1px solid var(--line);border-radius:15px;overflow:hidden}.table{width:100%;border-collapse:collapse;text-align:left}.table th{font-size:10px;color:#838ba0;font-weight:700;background:#f8f9fc;padding:12px 14px;white-space:nowrap}.table td{padding:13px 14px;border-top:1px solid var(--line);font-size:12px;vertical-align:top}.table tr:first-child td{border-top:0}.zone-cell{font-weight:800;font-size:13px!important}.desc{display:block;font-size:10px;font-weight:400;color:var(--muted);margin-top:4px;line-height:1.45}.assignment{display:flex;align-items:center;gap:7px;margin:0 0 7px;white-space:nowrap}.assignment:last-child{margin-bottom:0}.time-pill{display:inline-flex;align-items:center;border-radius:7px;background:#f1f3ff;color:#4a5cce;padding:6px 8px;font-size:10px;font-weight:700;white-space:nowrap}.person{display:flex;align-items:center;gap:7px;font-weight:700}.avatar{display:grid;place-items:center;width:25px;height:25px;border-radius:8px;background:#eaf5f1;color:#31886c;font-size:10px;flex:none}.unassigned{font-size:11px;color:#a2a9b8}.table-empty{padding:58px 20px;text-align:center;color:#a0a7b6}.table-empty .empty-icon{font-size:28px;margin-bottom:9px}.table-empty b{display:block;color:#586176;font-size:13px;margin-bottom:5px}.table-empty span{font-size:11px}.preview-foot{display:flex;justify-content:space-between;gap:10px;margin-top:13px;color:#a1a8b7;font-size:10px}.setting-block{border-top:1px solid var(--line);padding-top:17px;margin-top:18px}.setting-block h3{font-size:12px;margin:0 0 12px}.zone-admin{display:flex;gap:8px}.zone-admin input{flex:1;min-width:0}.zone-add{border:0;border-radius:10px;background:var(--pale);color:var(--primary);font-size:12px;font-weight:700;padding:0 13px}.zone-list{margin-top:10px}.zone-setting{display:flex;align-items:flex-start;gap:8px;padding:10px 0;border-bottom:1px solid #f0f1f5}.zone-setting:last-child{border:0}.zone-setting-copy{flex:1;min-width:0}.zone-setting-copy b{display:block;font-size:12px}.zone-setting-copy span{display:block;color:var(--muted);font-size:10px;margin-top:3px}.empty-settings{font-size:11px;color:#9ba3b3;padding:8px 0}.hidden{display:none!important}.toast{position:fixed;left:50%;bottom:24px;transform:translate(-50%,16px);padding:11px 16px;border-radius:30px;background:#18233c;color:white;font-size:12px;opacity:0;pointer-events:none;transition:.2s;z-index:3}.toast.show{opacity:1;transform:translate(-50%,0)}
    .toggle-row{display:flex;align-items:center;gap:10px;padding:10px 0;cursor:pointer}.toggle-row input{width:18px;height:18px;accent-color:var(--primary);flex:none}.toggle-row b{display:block;font-size:12px}.toggle-row small{display:block;color:var(--muted);font-size:10px;margin-top:3px}.input-static{border:1px solid #dfe3ec;border-radius:11px;padding:11px 12px;font-size:14px;color:var(--ink);background:#f8f9fc}.matrix th:first-child,.matrix td:first-child{position:sticky;left:0;background:#f8f9fc;z-index:1}.matrix td:first-child{font-weight:700;color:#59647c}.matrix td{min-width:145px;padding:6px 10px;text-align:center;vertical-align:top}.matrix th{text-align:center;vertical-align:top}.matrix th:not(:first-child){min-width:165px}.matrix .assignment{white-space:normal}.slot-time{height:42px;display:flex;align-items:center;justify-content:center}.slot-people{display:flex;flex-direction:column;align-items:center;justify-content:flex-start;gap:4px}.slot-person{height:28px;display:flex;align-items:center;justify-content:center;gap:7px;font-weight:700;white-space:nowrap}
    @media(max-width:780px){.topbar{padding:13px 14px}.brand-icon{width:36px;height:36px}.brand h1{font-size:14px}.brand p{font-size:10px}.nav button{padding:9px 11px;font-size:11px}.wrap{display:flex;flex-direction:column;margin:13px auto;padding:0 12px 38px;gap:12px}.editor,.settings,.preview{width:100%;padding:17px;border-radius:17px;position:static}.preview-top{display:block}.actions{margin-top:14px}.actions button{flex:1}.table-wrap{overflow:auto}.table{min-width:525px}.matrix{min-width:max-content}.preview-foot{font-size:9px}}
    @media(max-width:390px){.topbar{gap:8px}.brand{gap:8px}.brand p{display:none}.nav button{padding:8px 9px}.editor,.settings,.preview{padding:14px}.action{padding:10px 8px;font-size:11px}}
  </style>
</head>
<body>
  <header class="topbar"><div class="brand"><div class="brand-icon">▦</div><div><h1 id="brand-title">구역별 활동 배치표</h1><p>구역별 담당자와 활동 시간을 한눈에</p></div></div><nav class="nav" aria-label="페이지 선택"><button class="active" data-page="schedule">배치표</button><button data-page="settings">설정</button></nav></header>
  <main class="wrap" id="schedule-page">
    <section class="panel editor" aria-label="배치 정보 입력">
      <div class="panel-head"><h2>담당자 배치 입력</h2><span class="step">간편 입력</span></div>
      <form id="entry-form">
        <div class="field" id="zone-input-wrap"><label for="zone">구역명</label><select id="zone" name="zone" required><option value="">구역을 선택해 주세요</option></select></div>
        <div class="field hidden" id="fixed-zone-display"></div>
        <div class="field" id="time-input-wrap"><label>시간</label><div class="time-row"><input id="start" name="start" type="time" value="09:00" aria-label="시작 시간" required><input id="end" name="end" type="time" value="12:00" aria-label="마치는 시간" required></div></div>
        <div class="field hidden" id="fixed-time-display"></div>
        <div class="field"><label id="person-label" for="person">담당자 이름</label><input id="person" name="person" placeholder="예: 김민수" maxlength="40" required></div>
        <button class="add-btn" id="add-button" type="submit">＋ 추가하기</button>
      </form>
      <p class="helper">같은 구역에 여러 담당자를 추가할 수 있어요. 구역은 설정에서 먼저 등록해 주세요.</p>
      <div class="entries"><div class="entries-head"><strong>등록된 담당자 <span id="count">0</span></strong><button class="text-btn" id="clear" type="button">전체 삭제</button></div><div id="entry-list"></div></div>
    </section>
    <section class="panel preview" aria-label="배치표 미리보기">
      <div class="preview-top"><div class="preview-title"><p class="eyebrow">ACTIVITY SCHEDULE</p><h2 id="schedule-title">구역별 활동 배치표</h2><p id="date-label"></p></div><div class="actions"><button class="action" id="download" type="button">이미지 저장</button><button class="action primary" id="share" type="button">공유하기</button></div></div>
      <div class="table-wrap"><div id="table-area"></div></div>
      <div class="preview-foot"><span id="foot-title">구역별 활동 배치표</span><span id="total-label">총 0명</span></div>
    </section>
  </main>
  <main class="wrap hidden" id="settings-page" style="grid-template-columns:minmax(0,680px);justify-content:center">
    <section class="panel settings" aria-label="배치표 설정"><div class="panel-head"><h2>배치표 설정</h2><span class="step">표시와 구역 관리</span></div>
      <div class="field"><label for="title-setting">배치표 제목</label><input id="title-setting" maxlength="50" placeholder="예: 구역별 활동 배치표"></div>
      <div class="field"><label for="person-setting">담당자 입력 항목 이름</label><input id="person-setting" maxlength="20" placeholder="예: 담당자 이름"></div>
      <div class="setting-block"><h3>구역 추가</h3><form id="zone-form"><div class="zone-admin"><div class="field" style="flex:1;margin:0"><input id="zone-new" maxlength="40" placeholder="새 구역명 (예: 안내 데스크)" required></div><button class="zone-add" type="submit">구역 추가</button></div></form><div class="field" style="margin-top:10px"><label for="zone-description">구역 설명 <span style="font-weight:400;color:#9aa1b1">(선택)</span></label><input id="zone-description" maxlength="100" placeholder="위치나 담당 업무를 적어 주세요"></div><div class="zone-list" id="zone-list"></div></div>
      <div class="setting-block"><h3>수기로 입력하는 데이터</h3>
        <div class="field"><label for="add-button-setting">추가 버튼 문구</label><input id="add-button-setting" maxlength="24" value="추가하기" placeholder="추가하기"></div>
      </div>
      <div class="setting-block"><h3>배치 기본값 고정</h3>
        <label class="toggle-row"><input id="lock-zone" type="checkbox"><span><b>모든 담당자를 한 구역에 배치</b><small>입력할 때 구역 선택을 고정합니다.</small></span></label>
        <div class="field hidden" id="fixed-zone-setting"><label for="fixed-zone-select">고정할 구역</label><select id="fixed-zone-select"></select></div>
        <label class="toggle-row"><input id="lock-time" type="checkbox"><span><b>모든 담당자의 시간을 동일하게 설정</b><small>입력할 때 활동 시간을 고정합니다.</small></span></label>
        <div class="field hidden" id="fixed-time-setting"><label>고정할 시간</label><div class="time-row"><input id="fixed-start" type="time" value="09:00" aria-label="고정 시작 시간" required><input id="fixed-end" type="time" value="12:00" aria-label="고정 종료 시간" required></div></div>
      </div>
      <p class="helper">설정은 자동 저장되며, 추가한 구역은 배치표와 이미지에 같은 형식으로 표시됩니다. 배치가 있는 구역을 삭제하면 그 구역의 담당자 배치도 함께 삭제됩니다.</p>
    </section>
  </main>
  <div class="toast" id="toast" role="status"></div>
  <script>
    const KEY='activity-schedule-v2',OLD_KEY='activity-schedule-v1';
    const $=s=>document.querySelector(s);
    const safe=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
    const id=()=>Math.random().toString(36).slice(2,10);
    let state={title:'구역별 활동 배치표',personLabel:'담당자 이름',addButtonLabel:'추가하기',zones:[],assignments:[],lockZone:false,fixedZoneId:'',lockTime:false,fixedStart:'09:00',fixedEnd:'12:00'};
    try{const saved=JSON.parse(localStorage.getItem(KEY)||'null');if(saved&&Array.isArray(saved.zones)&&Array.isArray(saved.assignments))state={...state,...saved};else{const old=JSON.parse(localStorage.getItem(OLD_KEY)||'[]');if(Array.isArray(old)){for(const r of old){let z=state.zones.find(z=>z.name===r.zone);if(!z){z={id:id(),name:r.zone,description:r.description||''};state.zones.push(z)}state.assignments.push({id:id(),zoneId:z.id,start:r.start,end:r.end,person:r.person})}}}}catch{}
    const dateText=new Intl.DateTimeFormat('ko-KR',{year:'numeric',month:'long',day:'numeric',weekday:'long'}).format(new Date());$('#date-label').textContent=dateText;
    function persist(){try{localStorage.setItem(KEY,JSON.stringify(state))}catch{toast('저장 공간이 부족해요. 이미지 저장은 계속 사용할 수 있습니다.')}}
    function toast(message){const el=$('#toast');el.textContent=message;el.classList.add('show');clearTimeout(toast.t);toast.t=setTimeout(()=>el.classList.remove('show'),2400)}
    function groups(){return state.zones.map(z=>({...z,people:state.assignments.filter(a=>a.zoneId===z.id)}))}
    function slotsFor(group){const slots=[];for(const a of group.people){let slot=slots.find(s=>s.start===a.start&&s.end===a.end);if(!slot){slot={start:a.start,end:a.end,people:[]};slots.push(slot)}slot.people.push(a)}return slots.map(s=>({...s,timeHeight:42,peopleHeight:Math.max(32,s.people.length*32+4)}))}
    function render(){
      $('#brand-title').textContent=state.title;$('#schedule-title').textContent=state.title;$('#foot-title').textContent=state.title;$('#person-label').textContent=state.personLabel;$('#add-button').textContent=`＋ ${state.addButtonLabel}`;$('#add-button-setting').value=state.addButtonLabel;document.title=state.title;
      if(state.lockZone&&state.fixedZoneId&&!state.zones.some(z=>z.id===state.fixedZoneId))state.fixedZoneId=state.zones[0]?.id||'';
      const selected=$('#zone').value;$('#zone').innerHTML='<option value="">구역을 선택해 주세요</option>'+state.zones.map(z=>`<option value="${safe(z.id)}">${safe(z.name)}</option>`).join('');if(state.zones.some(z=>z.id===selected))$('#zone').value=selected;
      $('#fixed-zone-select').innerHTML=state.zones.map(z=>`<option value="${safe(z.id)}">${safe(z.name)}</option>`).join('');if(state.fixedZoneId)$('#fixed-zone-select').value=state.fixedZoneId;
      $('#lock-zone').checked=!!state.lockZone;$('#lock-time').checked=!!state.lockTime;$('#fixed-zone-setting').classList.toggle('hidden',!state.lockZone);$('#fixed-time-setting').classList.toggle('hidden',!state.lockTime);$('#fixed-start').value=state.fixedStart;$('#fixed-end').value=state.fixedEnd;
      const fixedZone=state.zones.find(z=>z.id===state.fixedZoneId);$('#zone-input-wrap').classList.toggle('hidden',!!state.lockZone);$('#fixed-zone-display').classList.toggle('hidden',!state.lockZone);$('#fixed-zone-display').innerHTML=state.lockZone?`<label>구역명 · 고정</label><div class="field input-static">${safe(fixedZone?.name||'설정에서 구역을 선택해 주세요')}</div>`:'';$('#zone').required=!state.lockZone;$('#zone').disabled=!!state.lockZone;
      $('#time-input-wrap').classList.toggle('hidden',!!state.lockTime);$('#fixed-time-display').classList.toggle('hidden',!state.lockTime);$('#fixed-time-display').innerHTML=state.lockTime?`<label>시간 · 고정</label><div class="field input-static">${safe(state.fixedStart)} – ${safe(state.fixedEnd)}</div>`:'';$('#start').required=!state.lockTime;$('#end').required=!state.lockTime;$('#start').disabled=!!state.lockTime;$('#end').disabled=!!state.lockTime;
      $('#count').textContent=state.assignments.length;$('#total-label').textContent=`총 ${state.assignments.length}명 · ${state.zones.length}개 구역`;
      $('#entry-list').innerHTML=state.assignments.length?state.assignments.map((a,i)=>{const z=state.zones.find(z=>z.id===a.zoneId);return `<div class="entry"><span class="entry-dot"></span><div class="entry-copy"><b>${safe(z?.name||'삭제된 구역')} · ${safe(a.person)}</b><span>${safe(a.start)}–${safe(a.end)}</span></div><button class="remove" type="button" aria-label="${safe(a.person)} 배치 삭제" data-remove="${i}">×</button></div>`}).join(''):'<div class="empty-small">아직 등록된 담당자가 없어요.</div>';
      const gs=groups();$('#table-area').innerHTML=gs.length?`<table class="table matrix"><thead><tr><th>구분</th>${gs.map(g=>`<th>${safe(g.name)}${g.description?`<span class="desc">${safe(g.description)}</span>`:''}</th>`).join('')}</tr></thead><tbody><tr><td>시간</td>${gs.map(g=>{const slots=slotsFor(g);return `<td>${slots.length?slots.map(s=>`<div class="slot-time"><span class="time-pill">${safe(s.start)} – ${safe(s.end)}</span></div>`).join(''):'<span class="unassigned">시간 미정</span>'}</td>`}).join('')}</tr><tr><td>${safe(state.personLabel)}</td>${gs.map(g=>{const slots=slotsFor(g);return `<td>${slots.length?slots.map(s=>`<div class="slot-people" style="height:${s.peopleHeight}px">${s.people.map(a=>`<div class="slot-person"><span class="avatar">${safe([...a.person][0]||'담')}</span>${safe(a.person)}</div>`).join('')}</div>`).join(''):'<span class="unassigned">담당자 미정</span>'}</td>`}).join('')}</tr></tbody></table>`:'<div class="table-empty"><div class="empty-icon">✦</div><b>등록된 구역이 없어요</b><span>설정 페이지에서 구역을 추가하면 배치표에 표시됩니다.</span></div>';
      $('#zone-list').innerHTML=state.zones.length?state.zones.map(z=>`<div class="zone-setting"><span class="entry-dot" style="margin-top:4px"></span><div class="zone-setting-copy"><b>${safe(z.name)}</b><span>${safe(z.description||'설명 없음')} · 담당자 ${state.assignments.filter(a=>a.zoneId===z.id).length}명</span></div><button class="remove" type="button" aria-label="${safe(z.name)} 구역 삭제" data-zone-remove="${safe(z.id)}">×</button></div>`).join(''):'<div class="empty-settings">등록된 구역이 없습니다.</div>';
    }
    document.querySelectorAll('[data-page]').forEach(btn=>btn.addEventListener('click',()=>{document.querySelectorAll('[data-page]').forEach(b=>b.classList.toggle('active',b===btn));$('#schedule-page').classList.toggle('hidden',btn.dataset.page!=='schedule');$('#settings-page').classList.toggle('hidden',btn.dataset.page!=='settings')}));
    $('#title-setting').value=state.title;$('#person-setting').value=state.personLabel;
    $('#title-setting').addEventListener('input',e=>{state.title=e.target.value.trim()||'구역별 활동 배치표';persist();$('#brand-title').textContent=state.title;$('#schedule-title').textContent=state.title;$('#foot-title').textContent=state.title;document.title=state.title});
    $('#person-setting').addEventListener('input',e=>{state.personLabel=e.target.value.trim()||'담당자 이름';persist();$('#person-label').textContent=state.personLabel;const label=document.querySelector('.matrix tbody tr:last-child td:first-child');if(label)label.textContent=state.personLabel});
    $('#add-button-setting').addEventListener('input',e=>{state.addButtonLabel=e.target.value.trim()||'추가하기';persist();$('#add-button').textContent=`＋ ${state.addButtonLabel}`});
    $('#lock-zone').addEventListener('change',e=>{state.lockZone=e.target.checked;if(state.lockZone&&!state.fixedZoneId)state.fixedZoneId=state.zones[0]?.id||'';persist();render()});
    $('#fixed-zone-select').addEventListener('change',e=>{state.fixedZoneId=e.target.value;persist();render()});
    $('#lock-time').addEventListener('change',e=>{state.lockTime=e.target.checked;persist();render()});
    $('#fixed-start').addEventListener('input',e=>{state.fixedStart=e.target.value;persist();updateFixedTime()});$('#fixed-end').addEventListener('input',e=>{state.fixedEnd=e.target.value;persist();updateFixedTime()});
    function updateFixedTime(){const display=$('#fixed-time-display');if(state.lockTime)display.innerHTML=`<label>시간 · 고정</label><div class="input-static">${safe(state.fixedStart)} – ${safe(state.fixedEnd)}</div>`}
    $('#zone-form').addEventListener('submit',e=>{e.preventDefault();const name=$('#zone-new').value.trim();if(!name)return;if(state.zones.some(z=>z.name.toLocaleLowerCase()===name.toLocaleLowerCase())){toast('이미 등록된 구역명이에요.');return}state.zones.push({id:id(),name,description:$('#zone-description').value.trim()});$('#zone-new').value='';$('#zone-description').value='';persist();render();toast('구역을 추가했어요.')});
    $('#zone-list').addEventListener('click',e=>{const b=e.target.closest('[data-zone-remove]');if(!b)return;const zid=b.dataset.zoneRemove;state.zones=state.zones.filter(z=>z.id!==zid);state.assignments=state.assignments.filter(a=>a.zoneId!==zid);persist();render()});
    $('#entry-form').addEventListener('submit',e=>{e.preventDefault();const f=new FormData(e.currentTarget),zoneId=state.lockZone?state.fixedZoneId:f.get('zone');if(!zoneId){toast('먼저 설정에서 구역을 추가하고 고정 구역을 선택해 주세요.');return}state.assignments.push({id:id(),zoneId,start:state.lockTime?state.fixedStart:f.get('start'),end:state.lockTime?state.fixedEnd:f.get('end'),person:f.get('person').trim()});persist();render();$('#person').value='';$('#person').focus()});
    $('#entry-list').addEventListener('click',e=>{const b=e.target.closest('[data-remove]');if(b){state.assignments.splice(Number(b.dataset.remove),1);persist();render()}});
    $('#clear').addEventListener('click',()=>{if(!state.assignments.length)return;state.assignments=[];persist();render();toast('담당자 배치를 모두 삭제했어요.')});
    function roundRect(ctx,x,y,w,h,r){ctx.beginPath();ctx.roundRect(x,y,w,h,r)}
    function fitText(ctx,str,x,y,max){let s=String(str);while(ctx.measureText(s).width>max&&s.length>1)s=s.slice(0,-2)+'…';ctx.fillText(s,x,y)}
    function centerText(ctx,str,cx,y,max){let s=String(str);while(ctx.measureText(s).width>max&&s.length>1)s=s.slice(0,-2)+'…';ctx.fillText(s,cx-ctx.measureText(s).width/2,y)}
    function imageBlob(){
      const gs=groups();if(!gs.length){toast('먼저 설정에서 구역을 추가해 주세요.');return Promise.resolve(null)}
      const slotGroups=gs.map(g=>slotsFor(g)),pad=56,labelW=180,colW=250,W=pad*2+labelW+colW*gs.length,headerH=176,timeRowH=Math.max(54,...slotGroups.map(slots=>slots.length*42)),peopleRowH=Math.max(54,...slotGroups.map(slots=>slots.reduce((sum,s)=>sum+s.peopleHeight,0))),bodyH=timeRowH+peopleRowH,H=headerH+bodyH+pad;
      const c=document.createElement('canvas'),x=c.getContext('2d');c.width=W;c.height=H;x.fillStyle='#f5f7fb';x.fillRect(0,0,W,H);x.fillStyle='#fff';roundRect(x,24,24,W-48,H-48,26);x.fill();
      x.fillStyle='#475de8';x.font='700 17px -apple-system,BlinkMacSystemFont,sans-serif';x.fillText('ACTIVITY SCHEDULE',pad,65);x.fillStyle='#18233c';x.font='700 32px -apple-system,BlinkMacSystemFont,sans-serif';fitText(x,state.title,pad,108,W-pad*2);x.fillStyle='#778198';x.font='400 16px -apple-system,BlinkMacSystemFont,sans-serif';x.fillText(dateText,pad,139);
      const tableX=pad,tableY=headerH,tableW=labelW+colW*gs.length,headH=56;x.fillStyle='#f8f9fc';x.fillRect(tableX,tableY,tableW,headH+bodyH);x.strokeStyle='#e8ebf2';x.lineWidth=1;
      x.fillStyle='#838ba0';x.font='700 14px -apple-system,BlinkMacSystemFont,sans-serif';centerText(x,'구분',tableX+labelW/2,tableY+35,labelW-24);
      gs.forEach((g,i)=>{const cx=tableX+labelW+colW*i;x.fillStyle='#18233c';x.font='700 16px -apple-system,BlinkMacSystemFont,sans-serif';centerText(x,g.name,cx+colW/2,tableY+29,colW-24);if(g.description){x.fillStyle='#778198';x.font='400 12px -apple-system,BlinkMacSystemFont,sans-serif';centerText(x,g.description,cx+colW/2,tableY+47,colW-24)}x.beginPath();x.moveTo(cx,tableY);x.lineTo(cx,tableY+headH+bodyH);x.stroke()});
      const row1=tableY+headH,row2=row1+timeRowH;x.beginPath();x.moveTo(tableX,row1);x.lineTo(tableX+tableW,row1);x.moveTo(tableX,row2);x.lineTo(tableX+tableW,row2);x.moveTo(tableX,row2+peopleRowH);x.lineTo(tableX+tableW,row2+peopleRowH);x.stroke();
      x.fillStyle='#59647c';x.font='700 14px -apple-system,BlinkMacSystemFont,sans-serif';centerText(x,'시간',tableX+labelW/2,row1+timeRowH/2+5,labelW-24);centerText(x,state.personLabel,tableX+labelW/2,row2+peopleRowH/2+5,labelW-24);
      gs.forEach((g,i)=>{const cx=tableX+labelW+colW*i,slots=slotGroups[i];if(!slots.length){x.fillStyle='#a2a9b8';x.font='400 13px -apple-system,BlinkMacSystemFont,sans-serif';centerText(x,'시간 미정',cx+colW/2,row1+timeRowH/2+5,colW-24);centerText(x,'담당자 미정',cx+colW/2,row2+peopleRowH/2+5,colW-24);return}let timeOffset=0,peopleOffset=0;slots.forEach(s=>{x.fillStyle='#4a5cce';x.font='700 13px -apple-system,BlinkMacSystemFont,sans-serif';centerText(x,`${s.start} – ${s.end}`,cx+colW/2,row1+timeOffset+28,colW-24);s.people.forEach((a,j)=>{x.fillStyle='#18233c';x.font='700 14px -apple-system,BlinkMacSystemFont,sans-serif';centerText(x,a.person,cx+colW/2,row2+peopleOffset+23+j*32,colW-24)});timeOffset+=s.timeHeight;peopleOffset+=s.peopleHeight})});
      x.fillStyle='#a1a8b7';x.font='400 13px -apple-system,BlinkMacSystemFont,sans-serif';x.fillText(`${state.title} · ${state.zones.length}개 구역 · ${state.assignments.length}명`,pad,H-28);return new Promise(resolve=>c.toBlob(resolve,'image/png'))
    }
    async function saveImage(){const blob=await imageBlob();if(!blob)return;const a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download='활동-배치표.png';a.click();setTimeout(()=>URL.revokeObjectURL(a.href),1000);toast('배치표 이미지를 저장했어요.')}
    $('#download').addEventListener('click',saveImage);
    $('#share').addEventListener('click',async()=>{const blob=await imageBlob();if(!blob)return;const file=new File([blob],'활동-배치표.png',{type:'image/png'});if(navigator.canShare?.({files:[file]})){try{await navigator.share({files:[file],title:state.title});return}catch(err){if(err.name==='AbortError')return}}saveImage()});
    render();persist();
  </script>
</body>
</html>
